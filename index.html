<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Shamama ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating hearts -->
    <div class="hearts">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
    </div>


    <!-- COUNTDOWN SCREEN -->
    <section id="countdown-screen" class="screen">

        <p class="small-title">
            ♡ A little surprise is waiting for you... ♡
        </p>

        <h1>Shamama</h1>

        <h2>My Churail ♡</h2>

        <div class="love-line">
            ♡ ───── ♥ ───── ♡
        </div>

        <p class="waiting">
            Something beautiful will be unlocked at midnight...
        </p>

        <div class="countdown">

            <div class="time-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>MINUTES</small>
            </div>

            <div class="colon">:</div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>SECONDS</small>
            </div>

        </div>

        <p class="date">
            19 • 09 • 2026
        </p>

        <p class="secret">
            Keep this little secret safe... 🤫❤️
        </p>

    </section>



    <!-- BIRTHDAY REVEAL -->


    <script src="script.js"></script>

</body>
            </html>
